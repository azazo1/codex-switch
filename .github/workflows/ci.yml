name: CI

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的已有 tag, 留空时只构建并上传 artifact"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ inputs.tag != '' && format('refs/tags/{0}', inputs.tag) || github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: 解析并校验发布上下文
    runs-on: ubuntu-latest
    outputs:
      is_release: ${{ steps.release_context.outputs.is_release }}
      tag_name: ${{ steps.release_context.outputs.tag_name }}
      source_ref: ${{ steps.release_context.outputs.source_ref }}
      version: ${{ steps.release_version.outputs.version }}

    steps:
      - name: 解析发布上下文
        id: release_context
        env:
          EVENT_NAME: ${{ github.event_name }}
          CURRENT_REF: ${{ github.ref }}
          CURRENT_REF_NAME: ${{ github.ref_name }}
          CURRENT_SHA: ${{ github.sha }}
          DISPATCH_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          is_release=false
          tag_name=""
          source_ref="$CURRENT_SHA"

          if [[ "$EVENT_NAME" == "push" && "$CURRENT_REF" == refs/tags/* ]]; then
            is_release=true
            tag_name="$CURRENT_REF_NAME"
            source_ref="$CURRENT_REF"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && -n "$DISPATCH_TAG" ]]; then
            git check-ref-format "refs/tags/$DISPATCH_TAG"
            is_release=true
            tag_name="$DISPATCH_TAG"
            source_ref="refs/tags/$DISPATCH_TAG"
          fi

          echo "is_release=$is_release" >> "$GITHUB_OUTPUT"
          echo "tag_name=$tag_name" >> "$GITHUB_OUTPUT"
          echo "source_ref=$source_ref" >> "$GITHUB_OUTPUT"

      - name: 检出版本来源
        if: steps.release_context.outputs.is_release == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release_context.outputs.source_ref }}

      - name: 安装 Rust 工具链
        if: steps.release_context.outputs.is_release == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: 校验 tag 和包版本
        id: release_version
        if: steps.release_context.outputs.is_release == 'true'
        env:
          TAG_NAME: ${{ steps.release_context.outputs.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(
            cargo metadata --locked --no-deps --format-version 1 |
              jq -er '.packages[] | select(.name == "codex-switch") | .version'
          )"
          expected_tag="v$package_version"

          if [[ "$TAG_NAME" != "$expected_tag" ]]; then
            echo "tag $TAG_NAME 与包版本 $package_version 不一致" >&2
            exit 1
          fi

          echo "version=$package_version" >> "$GITHUB_OUTPUT"

  test:
    name: 测试
    runs-on: ubuntu-22.04

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Linux 依赖
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libwayland-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxdo-dev \
            libxkbcommon-dev \
            pkg-config

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust 构建
        uses: Swatinem/rust-cache@v2
        with:
          key: test

      - name: 运行测试
        run: cargo test --locked

  build:
    name: 构建 ${{ matrix.name }}
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            id: linux-x86_64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux
          - name: Linux arm64
            id: linux-aarch64
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            platform: linux
          - name: Windows x64
            id: windows-x86_64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            platform: windows
          - name: Windows arm64
            id: windows-aarch64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            platform: windows
          - name: macOS x64
            id: macos-x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            platform: macos
          - name: macOS arm64
            id: macos-aarch64
            runner: macos-15
            target: aarch64-apple-darwin
            platform: macos

    steps:
      - name: 检出目标提交
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.source_ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: 安装 Linux 依赖
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libwayland-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxdo-dev \
            libxkbcommon-dev \
            pkg-config

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 缓存 Rust 构建
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: 构建 release 二进制文件
        run: cargo build --locked --release --bins --target ${{ matrix.target }}

      - name: 校验 Linux 二进制文件
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          binary="target/${{ matrix.target }}/release/codex-switch"
          test -x "$binary"
          file "$binary" | grep -q 'ELF'

      - name: 校验 Windows 二进制文件
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $binary = "target/${{ matrix.target }}/release/codex-switch.exe"
          if (-not (Test-Path -LiteralPath $binary -PathType Leaf)) {
            throw "未找到 Windows 二进制文件: $binary"
          }
          $header = [System.IO.File]::ReadAllBytes($binary)
          if ($header.Length -lt 2 -or $header[0] -ne 0x4d -or $header[1] -ne 0x5a) {
            throw "Windows 二进制文件没有有效的 PE 文件头: $binary"
          }
          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;

          public static class PeResources
          {
              private const uint LoadLibraryAsDataFile = 0x00000002;
              private static readonly IntPtr GroupIcon = new IntPtr(14);
              private delegate bool EnumResourceName(IntPtr module, IntPtr type, IntPtr name, IntPtr parameter);

              [DllImport("kernel32.dll", CharSet = CharSet.Unicode, SetLastError = true)]
              private static extern IntPtr LoadLibraryEx(string fileName, IntPtr file, uint flags);

              [DllImport("kernel32.dll", CharSet = CharSet.Unicode, SetLastError = true)]
              [return: MarshalAs(UnmanagedType.Bool)]
              private static extern bool EnumResourceNames(
                  IntPtr module,
                  IntPtr type,
                  EnumResourceName callback,
                  IntPtr parameter
              );

              [DllImport("kernel32.dll")]
              [return: MarshalAs(UnmanagedType.Bool)]
              private static extern bool FreeLibrary(IntPtr module);

              public static bool HasGroupIcon(string path)
              {
                  IntPtr module = LoadLibraryEx(path, IntPtr.Zero, LoadLibraryAsDataFile);
                  if (module == IntPtr.Zero) {
                      throw new InvalidOperationException(
                          "LoadLibraryEx failed with error " + Marshal.GetLastWin32Error()
                      );
                  }

                  try {
                      bool found = false;
                      EnumResourceName callback = delegate {
                          found = true;
                          return false;
                      };
                      EnumResourceNames(module, GroupIcon, callback, IntPtr.Zero);
                      GC.KeepAlive(callback);
                      return found;
                  }
                  finally {
                      FreeLibrary(module);
                  }
              }
          }
          '@
          $resolvedBinary = (Resolve-Path -LiteralPath $binary).Path
          if (-not [PeResources]::HasGroupIcon($resolvedBinary)) {
            throw "Windows 二进制文件没有内嵌图标资源: $binary"
          }

      - name: 校验 macOS 二进制文件
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          binary="target/${{ matrix.target }}/release/codex-switch"
          test -x "$binary"
          file "$binary" | grep -q 'Mach-O'

      - name: 打包 Linux 产物
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/dist-linux.sh "target/${{ matrix.target }}/release"

      - name: 打包 Windows 产物
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          & scripts/dist-windows.ps1 -ProfileDir "target/${{ matrix.target }}/release"

      - name: 打包 macOS DMG
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/dist-macos.sh "target/${{ matrix.target }}/release"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: artifact-${{ matrix.id }}
          path: dist/codex-switch-*
          if-no-files-found: error
          retention-days: 14

  release:
    name: 创建 GitHub Release
    if: needs.version.outputs.is_release == 'true'
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码和 tags
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.source_ref }}
          fetch-depth: 0

      - name: 重新获取 annotated tag object
        env:
          TAG_NAME: ${{ needs.version.outputs.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          git check-ref-format "refs/tags/$TAG_NAME"
          git fetch --force origin \
            "refs/tags/$TAG_NAME:refs/tags/$TAG_NAME"

      - name: 校验 tag annotation
        env:
          TAG_NAME: ${{ needs.version.outputs.tag_name }}
          VERSION: ${{ needs.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          tag_ref="refs/tags/$TAG_NAME"
          manual_notes="docs/changelog/$VERSION.md"

          if [[ ! -s "$manual_notes" ]]; then
            echo "缺少 release notes: $manual_notes" >&2
            exit 1
          fi

          tag_type="$(git cat-file -t "$tag_ref")"
          if [[ "$tag_type" != "tag" ]]; then
            echo "发布 tag 必须是 annotated tag: $TAG_NAME" >&2
            exit 1
          fi

          git cat-file tag "$tag_ref" | sed '1,/^$/d' > tag-notes.md
          if ! grep -q '[^[:space:]]' tag-notes.md; then
            echo "发布 tag 的 annotation 不能为空: $TAG_NAME" >&2
            exit 1
          fi

          if ! cmp -s "$manual_notes" tag-notes.md; then
            echo "发布 tag 的 annotation 与 $manual_notes 不一致" >&2
            diff -u "$manual_notes" tag-notes.md || true
            exit 1
          fi

      - name: 下载 release 产物
        uses: actions/download-artifact@v4
        with:
          pattern: artifact-*
          path: release-artifacts
          merge-multiple: true

      - name: 生成 release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.version.outputs.tag_name }}
          VERSION: ${{ needs.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          manual_notes="docs/changelog/$VERSION.md"
          base_tag_file="docs/changelog/$VERSION-base.txt"
          api_args=(
            --method POST
            "repos/$GITHUB_REPOSITORY/releases/generate-notes"
            -f "tag_name=$TAG_NAME"
          )

          target_sha="$(git rev-parse HEAD)"
          api_args+=(-f "target_commitish=$target_sha")

          if [[ -s "$base_tag_file" ]]; then
            base_tag="$(<"$base_tag_file")"
            git check-ref-format "refs/tags/$base_tag"
            api_args+=(-f "previous_tag_name=$base_tag")
          fi

          gh api "${api_args[@]}" --jq '.body' > generated-notes.md
          cp "$manual_notes" release-notes.md

          if [[ -s generated-notes.md ]]; then
            printf '\n---\n\n' >> release-notes.md
            cat generated-notes.md >> release-notes.md
          fi

      - name: 生成校验和
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          cd release-artifacts
          archives=(codex-switch-*.tar.gz codex-switch-*.zip codex-switch-*.dmg)
          if (( ${#archives[@]} != 6 )); then
            echo "预期 6 个发布归档, 实际找到 ${#archives[@]} 个" >&2
            exit 1
          fi
          sha256sum "${archives[@]}" > SHA256SUMS

      - name: 创建或更新 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.version.outputs.tag_name }}
          VERSION: ${{ needs.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(
            release-artifacts/codex-switch-*.tar.gz
            release-artifacts/codex-switch-*.zip
            release-artifacts/codex-switch-*.dmg
            release-artifacts/SHA256SUMS
          )

          if (( ${#assets[@]} != 7 )); then
            echo "预期 7 个发布文件, 实际找到 ${#assets[@]} 个" >&2
            exit 1
          fi

          prerelease_args=()
          if [[ "$VERSION" == *-* ]]; then
            prerelease_args+=(--prerelease)
          fi

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" \
              --verify-tag \
              --title "Codex Switch v$VERSION" \
              --notes-file release-notes.md \
              "${prerelease_args[@]}"
            gh release upload "$TAG_NAME" "${assets[@]}" --clobber
          else
            gh release create "$TAG_NAME" "${assets[@]}" \
              --verify-tag \
              --title "Codex Switch v$VERSION" \
              --notes-file release-notes.md \
              "${prerelease_args[@]}"
          fi
